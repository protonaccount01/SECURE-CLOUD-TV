<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVE TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Lavender Light Theme Palette */
            --bg-body: #f7f5fa;
            --bg-surface: #ffffff;
            --primary: #9074c2;
            --primary-hover: #7b5eb0;
            --primary-light: #f1edfa;
            --primary-border: #e2d9f3;
            --text-main: #110e1b;   /* Deeper, near-black text */
            --text-muted: #4a4059;  /* Deeper muted text */
            --live-color: #e11d48;
            --live-bg: #ffe4e6;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 12px rgba(114, 98, 140, 0.05);
            --shadow-md: 0 8px 24px rgba(114, 98, 140, 0.1);
            --shadow-lg: 0 12px 32px rgba(114, 98, 140, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5effc 0%, #ffffff 30%, #f0f4ff 70%, #fff0f7 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid var(--primary-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .logo-text {
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
        }

        /* Layout */
        .wrapper {
            flex: 1;
            display: flex;
            gap: 24px;
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }

        /* Left Player Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: #ffffff;
            border: 1px solid var(--primary-border);
            box-shadow: var(--shadow-md);
        }

        .video-container {
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            position: relative;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: #1c152b;
            gap: 16px;
        }

        .video-placeholder-icon {
            font-size: 48px;
            opacity: 0.8;
            margin-bottom: -8px;
        }

        .player-info {
            padding: 24px 32px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
        }

        .player-channel-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
        }

        .player-channel-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--live-color);
            background: var(--live-bg);
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--live-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Right Sidebar List */
        .sidebar {
            width: 380px;
            background: #ffffff;
            border-radius: var(--radius-xl);
            border: 1px solid var(--primary-border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--primary-border);
            background: #ffffff;
            z-index: 2;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: var(--radius-md);
            border: 1px solid var(--primary-border);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 8px 16px;
            border-radius: 100px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .chip:hover {
            border-color: #000000;
            color: #000000;
        }

        .chip.active {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Custom Scrollbar for channel list */
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-track { background: transparent; }
        .channel-list::-webkit-scrollbar-thumb { background: var(--primary-border); border-radius: 10px; }
        .channel-list::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: transparent;
        }

        .channel-item:hover {
            background: #efebf5;
            border-color: #d8cfee;
        }

        .channel-item.active {
            background: #e4d8fb;
            border-color: #c0abeb;
            box-shadow: 0 2px 8px rgba(144, 116, 194, 0.2);
        }

        .channel-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .channel-info-col {
            flex: 1;
            min-width: 0;
        }

        .channel-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .channel-cat {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        .item-live-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            margin-left: 8px;
        }

        .channel-item.active .item-live-indicator {
            background: var(--live-color);
            box-shadow: 0 0 0 3px var(--live-bg);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            body { height: auto; overflow: visible; }
            .wrapper { flex-direction: column; padding: 16px; gap: 16px; overflow: visible; }
            .sidebar { width: 100%; flex: none; height: 600px; }
            .main-content { min-height: unset; flex: none; }
            .video-container { position: sticky; top: 70px; z-index: 5; } 
        }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <a href="/" class="logo">
      <div class="logo-text">LIVE TV</div>
      </a>
      <div style="font-weight: 600; color: #ffffff; font-size: 14px; padding: 6px 12px; border-radius: 12px; background: #000000;">
        37 Channels
      </div>
    </header>

    <!-- App Wrapper -->
    <div class="wrapper">
      <!-- Left: Player Area -->
      <main class="main-content">
        <div class="video-container" id="videoContainer">
          <video id="videoPlayer" controls="" autoplay=""></video>
          <div class="video-placeholder" id="videoPlaceholder">
            <div class="video-placeholder-icon">🍿</div>
            <h3 style="font-weight: 600; font-size: 18px;">Select a channel to watch</h3>
            <p style="opacity: 0.7; font-size: 14px;">Live streams from over 37 channels</p>
            <div class="spinner" id="playerSpinner"></div>
          </div>
        </div>
        <div class="player-info" id="playerInfo" style="display: none;">
          <div class="player-channel-meta">
            <div class="live-badge">
              <div class="live-dot"></div>
              LIVE NOW
            </div>
            <span id="playerCatDisplay" style="text-transform: capitalize;">—</span>
          </div>
          <div class="player-channel-title" id="playerTitle">Channel Name</div>
        </div>
      </main>

      <!-- Right: Sidebar List -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search channels..." autocomplete="off" />
          </div>
          <div class="filter-chips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="sports">Sports</button>
            <button class="chip" data-filter="news">News</button>
            <button class="chip" data-filter="entertainment">Entertainment</button>
          </div>
        </div>
        <div class="channel-list" id="channelList">
          <!-- Channels injected via JS -->
        </div>
      </aside>
    </div>

    <script>
      // অল্টারনেটিভ ফ্রি হাই-সিকিউর পাবলিক প্রক্সি (আইপি হাইড এবং 403 এরর সল্ভ করার জন্য)
      const proxyServer = "https://api.codetabs.com/v1/proxy?quest="; 

      const originalChannels = [{"name":"T Sports","id":"live1","url":"http:\/\/103.59.176.72:8083\/live1\/video.m3u8?token=123"},{"name":"Star Jalsha","id":"live2","url":"http:\/\/103.59.176.72:8083\/live2\/video.m3u8?token=123"},{"name":"Star Sports 1","id":"live3","url":"http:\/\/103.59.176.72:8083\/live3\/video.m3u8?token=123"},{"name":"Jalsha Movies","id":"live4","url":"http:\/\/103.59.176.72:8083\/live4\/video.m3u8?token=123"},{"name":"Star Sports 1 Hindi","id":"ss1_hindi","url":"http:\/\/103.59.176.72:8083\/ss1_hindi\/video.m3u8?token=123"},{"name":"Star Sports Select 1","id":"ss_select_1","url":"http:\/\/103.59.176.72:8083\/ss_select_1\/video.m3u8?token=123"},{"name":"Star Sports 3","id":"ss_select_2","url":"http:\/\/103.59.176.72:8083\/ss_select_2\/video.m3u8?token=123"},{"name":"Sun Bangla","id":"ss1_en","url":"http:\/\/103.59.176.72:8083\/ss1_en\/video.m3u8?token=123"},{"name":"Ananda TV","id":"ananda_tv","url":"http:\/\/103.59.176.72:8083\/ananda_tv\/video.m3u8?token=123"},{"name":"ATN News","id":"atn_news","url":"http:\/\/103.59.176.72:8083\/atn_news\/video.m3u8?token=123"},{"name":"DBC News","id":"dbc_news","url":"http:\/\/103.59.176.72:8083\/dbc_news\/video.m3u8?token=123"},{"name":"Ekattor TV","id":"ekattor_tv","url":"http:\/\/103.59.176.72:8083\/ekattor_tv\/video.m3u8?token=123"},{"name":"Jamuna TV","id":"jamuna_tv","url":"http:\/\/103.59.176.72:8083\/jamuna_tv\/video.m3u8?token=123"},{"name":"News24","id":"news24","url":"http:\/\/103.59.176.72:8083\/news24\/video.m3u8?token=123"},{"name":"Somoy TV","id":"somoy_tv","url":"http:\/\/103.59.176.72:8083\/somoy_tv\/video.m3u8?token=123"},{"name":"Channel 24","id":"channel24","url":"http:\/\/103.59.176.72:8083\/channel24\/video.m3u8?token=123"},{"name":"Bangla Vision","id":"banglavision","url":"http:\/\/103.59.176.72:8083\/banglavision\/video.m3u8?token=123"},{"name":"Bijoy TV","id":"bijoy_tv","url":"http:\/\/103.59.176.72:8083\/bijoy_tv\/video.m3u8?token=123"},{"name":"Boishakhi TV","id":"boishakhi_tv","url":"http:\/\/103.59.176.72:8083\/boishakhi_tv\/video.m3u8?token=123"},{"name":"BTV World","id":"btv_world","url":"http:\/\/103.59.176.72:8083\/btv_world\/video.m3u8?token=123"},{"name":"Channel 9","id":"channel_9","url":"http:\/\/103.59.176.72:8083\/channel_9\/video.m3u8?token=123"},{"name":"Channel i","id":"channel_i","url":"http:\/\/103.59.176.72:8083\/channel_i\/video.m3u8?token=123"},{"name":"Deepto TV","id":"deepto_tv","url":"http:\/\/103.59.176.72:8083\/deepto_tv\/video.m3u8?token=123"},{"name":"Desh TV","id":"desh_tv","url":"http:\/\/103.59.176.72:8083\/desh_tv\/video.m3u8?token=123"},{"name":"Ekushey TV","id":"ekushey_tv","url":"http:\/\/103.59.176.72:8083\/ekushey_tv\/video.m3u8?token=123"},{"name":"GTV","id":"gtv","url":"http:\/\/103.59.176.72:8083\/gtv\/video.m3u8?token=123"},{"name":"Mohona TV","id":"mohona_tv","url":"http:\/\/103.59.176.72:8083\/mohona_tv\/video.m3u8?token=123"},{"name":"Global HD Television","id":"global_hd","url":"http:\/\/103.59.176.72:8083\/global_hd\/video.m3u8?token=123"},{"name":"Maasranga TV","id":"maasranga","url":"http:\/\/103.59.176.72:8083\/maasranga\/video.m3u8?token=123"},{"name":"Nexus Television","id":"nexus_tv","url":"http:\/\/103.59.176.72:8083\/nexus_tv\/video.m3u8?token=123"},{"name":"Rtv","id":"rtv","url":"http:\/\/103.59.176.72:8083\/rtv\/video.m3u8?token=123"},{"name":"SATV","id":"satv","url":"http:\/\/103.59.176.72:8083\/satv\/video.m3u8?token=123"},{"name":"My TV","id":"mytv","url":"http:\/\/103.59.176.72:8083\/mytv\/video.m3u8?token=123"},{"name":"Nagorik TV","id":"nagorik_tv","url":"http:\/\/103.59.176.72:8083\/nagorik_tv\/video.m3u8?token=123"},{"name":"Sun Bangla","id":"sun_bangla","url":"http:\/\/103.59.176.72:8083\/sun_bangla\/video.m3u8?token=123"},{"name":"Star Sports 3","id":"star_sports_3","url":"http:\/\/103.59.176.72:8083\/star_sports_3\/video.m3u8?token=123"},{"name":"Duronto TV","id":"duronto_tv","url":"http:\/\/103.59.176.72:8083\/duronto_tv\/video.m3u8?token=123"}];
        
        // ব্যাকস্ল্যাশ পরিষ্কার করে লিঙ্কের সাথে প্রক্সি জুড়ে দেওয়ার লজিক
        const channels = originalChannels.map(ch => {
            const cleanUrl = ch.url.replace(/\\/g, ''); 
            return {
                ...ch,
                url: `${proxyServer}${encodeURIComponent(cleanUrl)}`
            };
        });

        // Categorization & Color Setup
        const sportKeywords = ['sport', 'star sport', 't sports', 'cricket', 'football'];
        const newsKeywords  = ['news', 'atn', 'dbc', 'ekattor', 'jamuna', 'somoy', 'channel 24', 'news24', 'nagorik'];

        function classify(name) {
            const n = name.toLowerCase();
            if (sportKeywords.some(k => n.includes(k))) return 'sports';
            if (newsKeywords.some(k => n.includes(k)))  return 'news';
            return 'entertainment';
        }

        // Lavender themed colors for icons
        const iconColors = ['#9074c2', '#a288ce', '#8566b8', '#9980c9', '#b5a1db'];

        channels.forEach((ch, idx) => {
            ch.category = classify(ch.name);
            ch.color = iconColors[idx % iconColors.length];
            const words = ch.name.split(/\s+/);
            ch.abbr = words.length >= 2 
                ? (words[0][0] + words[1][0]).toUpperCase() 
                : ch.name.substring(0, 2).toUpperCase();
        });

        // State
        let hlsInstance = null;
        let currentFilter = 'all';
        let searchQuery = '';
        let activeChannelId = null;

        // DOM
        const listEl = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const video = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('videoPlaceholder');
        const spinner = document.getElementById('playerSpinner');
        const playerInfo = document.getElementById('playerInfo');
        const playerTitle = document.getElementById('playerTitle');
        const playerCatDisplay = document.getElementById('playerCatDisplay');

        // Render Sidebar List
        function renderList() {
            listEl.innerHTML = '';
            
            const filtered = channels.filter(ch => {
                const matchCat = currentFilter === 'all' || ch.category === currentFilter;
                const matchSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="no-results">No channels found</div>`;
                return;
            }

            filtered.forEach(ch => {
                const item = document.createElement('div');
                item.className = `channel-item ${ch.id === activeChannelId ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="channel-icon" style="background: #000000; color: #ffffff;">${ch.abbr}</div>
                    <div class="channel-info-col">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-cat">${ch.category}</div>
                    </div>
                    <div class="item-live-indicator"></div>
                `;
                item.addEventListener('click', () => playChannel(ch));
                listEl.appendChild(item);
            });
        }

        // Play Channel
        function playChannel(ch) {
            activeChannelId = ch.id;
            renderList(); // re-render to update active state
            
            // UI Updates
            placeholder.style.background = 'rgba(0,0,0,0.8)';
            placeholder.innerHTML = '';
            placeholder.appendChild(spinner);
            placeholder.style.display = 'flex';
            spinner.style.display = 'block';
            
            playerInfo.style.display = 'flex';
            playerTitle.textContent = ch.name;
            playerCatDisplay.textContent = ch.category;

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            // HLS Setup
            if (Hls.isSupported()) {
                const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    placeholder.style.display = 'none';
                    video.play().catch(() => {});
                });
                hls.on(Hls.Events.ERROR, (_, d) => {
                    if (d.fatal) {
                        placeholder.innerHTML = '<span style="color:var(--live-color); font-weight:600;">Stream unavailable. Please try another channel.</span>';
                        placeholder.style.display = 'flex';
                    }
                });
                hlsInstance = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.addEventListener('loadedmetadata', () => {
                    placeholder.style.display = 'none';
                    video.play().catch(() => {});
                }, { once: true });
            }

            // Scroll to top on mobile
            if (window.innerWidth <= 1024) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Event Listeners for Filters
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderList();
            });
        });

        // Event Listener for Search
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderList();
        });

        // Initial Render
        renderList();
    </script>
  </body>
</html>
