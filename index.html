<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Stream Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #4f46e5;
        }
        .input-group {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4f46e5;
        }
        button {
            padding: 12px 24px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background-color: black;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Custom Stream Player</h2>
        
        <!-- ইউআরএল বসানোর বক্স এবং বাটন -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="এখানে ভিডিওর ডাইরেক্ট URL/Link পেস্ট করুন...">
            <button onclick="playVideo()">Stream</button>
        </div>
        
        <!-- ভিডিও প্লেয়ার -->
        <video id="myPlayer" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function playVideo() {
            var url = document.getElementById("videoUrl").value.trim();
            var player = document.getElementById("myPlayer");
            
            if (url === "") {
                alert("আগে একটা ভিডিওর লিংক দিন ভাই!");
                return;
            }
            
            // প্লেয়ারে নতুন লিংক সেট করে লোড করা হচ্ছে
            player.src = url;
            player.load();
            player.play().catch(function(error) {
                console.log("Auto-play prevented or error: ", error);
            });
        }
    </script>

</body>
</html>
